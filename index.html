<!DOCTYPE html>
<html lang="bn">
<head>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.header{background:#f57224;padding:12px;text-align:center;font-weight:bold;position:sticky;top:0;z-index:20}
.tabs{display:flex;overflow-x:auto;background:#111;padding:8px;gap:6px;position:sticky;top:44px;z-index:19}
.tab{white-space:nowrap;background:#222;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.tab.active{background:#f57224}
.card{background:#111;margin:10px;border-radius:12px;overflow:hidden;border:1px solid #222}
.card video,.card iframe{width:100%;height:215px;border:none}
.info{padding:10px}
.btn{padding:11px;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;margin:5px 0;font-size:14px}
.btn-play{background:#00c853;color:#fff}
.btn-down{background:#f57224;color:#fff}
.btn-share{background:#0084ff;color:#fff}
.btn-daraz{background:#fff;color:#f57224;display:block;text-decoration:none;text-align:center;padding:11px;border-radius:8px;margin:5px 0}
.ad-label{background:yellow;color:#000;padding:2px 7px;border-radius:4px;font-size:10px}
#chatBox{height:200px;overflow-y:auto;background:#000;padding:10px;border:1px solid #333;margin:10px;border-radius:10px}
.msg{background:#222;padding:7px 10px;border-radius:10px;margin:5px 0;font-size:13px}
</style>
</head>
<body>
<div class="header">🔥 SUPER APP BD - Video + Live TV + Chat</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('videos',this)">🎬 Videos</div>
<div class="tab" onclick="switchTab('live',this)">📺 Live TV</div>
<div class="tab" onclick="switchTab('upload',this)">📤 Upload</div>
<div class="tab" onclick="switchTab('chat',this)">💬 Chat</div>
</div>
<div id="videos">
<div class="card">
<span class="ad-label">AD - Video শুরুর আগে</span>
<video id="v1" controls ontimeupdate="midRollAd(this)" poster="https://i.ytimg.com/vi/9bZkp7q19f0/maxresdefault.jpg">
<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>
<div class="info">
<p>🔥 Viral Video</p>
<div class="btn btn-play" onclick="playWithAd('v1')">▶️ PLAY - আগে Ad</div>
<div class="btn btn-down" onclick="downloadWithAd('https://www.w3schools.com/html/mov_bbb.mp4')">⬇️ DOWNLOAD - Ad দেখে</div>
<div class="btn btn-share" onclick="shareVideo('Viral Video')">🔗 SHARE</div>
<a class="btn-daraz" href="https://s.daraz.com.bd/s.YeIxh?cc" target="_blank">🛒 Daraz Deal ৳299</a>
</div>
</div>
</div>
<div id="live" style="display:none">
<h3 style="text-align:center;color:#f57224">📺 সব TV Live</h3>
<div class="card"><p style="padding:10px">📺 Somoy TV Live</p><iframe src="https://www.youtube.com/embed/rbL5v3qXxN0" allowfullscreen></iframe></div>
<div class="card"><p style="padding:10px">📺 Jamuna TV Live</p><iframe src="https://www.youtube.com/embed/b5Zp_57y9hY" allowfullscreen></iframe></div>
<div class="card"><p style="padding:10px">📺 BTV Live</p><iframe src="https://www.youtube.com/embed/9Auq9mYxFEE" allowfullscreen></iframe></div>
</div>
<div id="upload" style="display:none">
<div style="background:#111;margin:10px;padding:15px;border-radius:12px;border:2px dashed #f57224">
<h3 style="color:#f57224;text-align:center">📤 Unlimited Upload</h3>
<input type="file" id="upFile" accept="video/*" style="width:100%;padding:10px;background:#222;color:white;border-radius:8px">
<input type="text" id="upTitle" placeholder="Title লিখুন" style="width:100%;padding:12px;margin-top:10px;background:#222;color:white;border-radius:8px;border:1px solid #444">
<button onclick="realUpload()" style="width:100%;padding:14px;background:#f57224;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:10px">🚀 UPLOAD</button>
<div id="myVideos"></div>
</div>
</div>
<div id="chat" style="display:none">
<h3 style="text-align:center;color:#00c853">💬 Worldwide Chat</h3>
<div id="chatBox"><div class="msg">🇧🇩 Rahim: App টা জোস!</div></div>
<div style="display:flex;padding:10px;gap:5px">
<input type="text" id="chatInput" placeholder="Message..." style="flex:1;padding:12px;background:#222;color:white;border-radius:20px;border:1px solid #444">
<button onclick="sendChat()" style="padding:12px 18px;background:#00c853;color:white;border:none;border-radius:20px;font-weight:bold">Send</button>
</div>
</div>
<script>
function switchTab(id,el){
document.getElementById('videos').style.display='none';
document.getElementById('live').style.display='none';
document.getElementById('upload').style.display='none';
document.getElementById('chat').style.display='none';
document.getElementById(id).style.display='block';
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}
function playWithAd(vid){window.open('https://demper.org/4/e8283733c30352cb0223ec5729c1cb88','_blank');setTimeout(()=>{document.getElementById(vid).play()},800);}
let midAdShown=false;
function midRollAd(video){
if(video.currentTime>10 && !midAdShown){
midAdShown=true;video.pause();
alert('📢 মাঝে Ad - 3 সেকেন্ড পর Video চলবে!');
window.open('https://demper.org/4/e8283733c30352cb0223ec5729c1cb88','_blank');
setTimeout(()=>{video.play();midAdShown=false},3000);
}
}
function downloadWithAd(url){
alert('⬇️ Download এর আগে Ad!');
window.open('https://demper.org/4/e8283733c30352cb0223ec5729c1cb88','_blank');
setTimeout(()=>{let a=document.createElement('a');a.href=url;a.download='video.mp4';a.click();window.location.href='https://s.daraz.com.bd/s.YeIxh?cc';},4000);
}
function realUpload(){
let file=document.getElementById('upFile').files[0];
let title=document.getElementById('upTitle').value;
if(!file){alert('Video Select করুন!');return;}
window.open('https://demper.org/4/e8283733c30352cb0223ec5729c1cb88','_blank');
let reader=new FileReader();
reader.onload=function(e){
let div=document.getElementById('myVideos');
div.innerHTML+=`<div class="card"><video controls src="${e.target.result}"></video><div class="info"><p>${title} - ✅ Upload Done!</p></div></div>`;
alert('✅ Upload Success!');
}
reader.readAsDataURL(file);
}
function sendChat(){
let txt=document.getElementById('chatInput').value;
if(!txt)return;
let box=document.getElementById('chatBox');
box.innerHTML+=`<div class="msg">🇧🇩 You: ${txt}</div>`;
document.getElementById('chatInput').value='';
box.scrollTop=box.scrollHeight;
if(box.children.length%5==0){window.open('https://demper.org/4/e8283733c30352cb0223ec5729c1cb88','_blank');}
}
function shareVideo(t){
if(navigator.share){navigator.share({title:t,text:'এই App এ সব আছে!',url:location.href})}
else{alert('Link Copy: '+location.href);window.open('https://demper.org/4/e8283733c30352cb0223ec5729c1cb88','_blank');}
}
</script>
</body>
  </html>
